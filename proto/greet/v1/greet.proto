syntax = "proto3";

package greet.v1;

option go_package = "gen/greet/v1;greetv1";

// Сообщение для Unary RPC
message HelloRequest{
    string name = 1;
}
message HelloReply {
    string message = 1;
}

//сообщение для Server Streaming
// Клиент отправляет пустой запрос или имя. Сервер шлет множество ответов!

message ManyHellosRequest{
    string name = 1;
    int32 num_replies = 2; // Сколько приветствий отправить?
}

service GreeterService{
    // Unary: 1 запрос > 1 ответ
    rpc SayHello(HelloRequest) returns (HelloReply);
    // Server Streaming: 1 запрос > множество (поток) ответов!
    rpc ManyHellos(ManyHellosRequest) returns (stream HelloReply); 
}

